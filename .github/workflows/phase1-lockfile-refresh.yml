name: Phase 1 dependency lockfile refresh

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - pnpm-workspace.yaml
      - artifacts/api-server/package.json
      - artifacts/bot/package.json
      - artifacts/outline-bot/package.json
      - .github/workflows/phase1-lockfile-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'work/phase1-dependency-security' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout dependency branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Commit lockfile update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already matches dependency manifests."
            exit 0
          fi
          git commit -m "chore: regenerate pnpm lockfile for security updates"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:$GITHUB_HEAD_REF"
